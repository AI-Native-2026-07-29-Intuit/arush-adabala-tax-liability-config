# platform/secret/40-taxcalc-api.secret.yaml - the taxcalc-api Secret,
# deliberately OUTSIDE the Argo-synced manifest set.
#
# WHY THE `secret/` SUBDIRECTORY. scripts/verify-appproject-guardrails.sh
# points a scratch Application at `platform/` with `recurse: false` and syncs
# it, to assert that the AppProject refuses Namespace / ResourceQuota /
# LimitRange. When the project denies them the sync fails closed and nothing
# is written - but when it does NOT (the script's own negative control runs
# against a deliberately permissive project) the sync succeeds and every file
# directly under platform/ is really applied. This file was directly under
# platform/ the first time that ran, and the placeholder below overwrote the
# out-of-band password in taxcalc-dev - the verifier breaking the thing it
# verified. Everything left directly under platform/ is idempotent; this file,
# the one destructive member of the set, is one directory down and out of
# reach of `recurse: false`.
#
# WHY THIS MOVED OUT OF base/ - a real failure, not a precaution.
#
# The W5 D3 manifest set carried this file with a placeholder value
# (`replace-at-apply-time-from-secrets-manager`) and CI overwrote it at apply
# time with a value from a real secret store; the placeholder in Git was inert
# because `kubectl apply -f manifests/` was the LAST writer and CI had already
# reseeded the Secret before it ran.
#
# Under GitOps that ordering is gone and the placeholder stops being inert.
# Argo CD's entire job is to make the cluster match Git, continuously, and
# with `selfHeal: true` it does so forever. On the first sync of the dev
# Application it faithfully wrote the placeholder over the real password the
# W5 D3 CI run had seeded, and the api pods began failing:
#
#   FATAL: password authentication failed for user "taxcalc_dev"
#   Connection error: ... Retrying in 64 sec...
#
# Postgres was still holding the password it had been INITIALISED with, so the
# two halves of the same credential disagreed. Re-seeding the Secret by hand
# would not have fixed it either: selfHeal reverts the hand-written value on
# the next reconcile, and the failure comes back a few minutes later - which
# is materially harder to debug than failing immediately.
#
# A placeholder secret in a continuously-reconciled manifest set is therefore
# strictly worse than no secret in the manifest set at all. This file is kept
# for its SHAPE - so the required keys are documented and reviewable - and is
# applied out-of-band, with the real value supplied separately:
#
#   for ns in taxcalc-dev taxcalc-staging taxcalc-prod; do
#     kubectl -n "$ns" delete secret taxcalc-api-secrets --ignore-not-found
#     kubectl -n "$ns" create secret generic taxcalc-api-secrets \
#       --from-literal=SPRING_DATASOURCE_PASSWORD="$(pwgen -s 24 1)"
#   done
#
# `delete` then `create`, NOT `apply` - and that is not style. A Secret Argo CD
# has previously synced carries the `app.kubernetes.io/instance` tracking
# label; `kubectl apply` MERGES, so the tracking label survives, and on the
# next reconcile after this file left base/ the controller saw a resource it
# still believed it owned that was no longer in Git and PRUNED it. The pods
# went straight to `CreateContainerConfigError: secret "taxcalc-api-secrets"
# not found`. Recreating the object from scratch leaves it untracked, which is
# what keeps prune away from it.
#
# `Secret` stays on the AppProject's namespaceResourceWhitelist: the kind is
# legitimate for this project (W6 D3 lands External Secrets Operator, whose
# ExternalSecret objects materialise real Secrets into these namespaces), and
# what changes then is that the VALUE comes from AWS Secrets Manager via IRSA
# rather than from anyone's laptop. At that point this file is deleted, not
# moved back.

apiVersion: v1
kind: Secret
metadata:
  name: taxcalc-api-secrets
  namespace: taxcalc-dev
  labels:
    app.kubernetes.io/name:       taxcalc-api
    app.kubernetes.io/component:  api
    app.kubernetes.io/part-of:    taxcalc
    app.kubernetes.io/managed-by: platform-team
type: Opaque
stringData:
  # MUST NOT be a real password. See the header - this is the documented shape
  # of the Secret; the value is supplied out-of-band.
  SPRING_DATASOURCE_PASSWORD: replace-at-apply-time-from-secrets-manager

---
apiVersion: v1
kind: Secret
metadata:
  name: taxcalc-api-secrets
  namespace: taxcalc-staging
  labels:
    app.kubernetes.io/name:       taxcalc-api
    app.kubernetes.io/component:  api
    app.kubernetes.io/part-of:    taxcalc
    app.kubernetes.io/managed-by: platform-team
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: replace-at-apply-time-from-secrets-manager

---
apiVersion: v1
kind: Secret
metadata:
  name: taxcalc-api-secrets
  namespace: taxcalc-prod
  labels:
    app.kubernetes.io/name:       taxcalc-api
    app.kubernetes.io/component:  api
    app.kubernetes.io/part-of:    taxcalc
    app.kubernetes.io/managed-by: platform-team
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: replace-at-apply-time-from-secrets-manager
