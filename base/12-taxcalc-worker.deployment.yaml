# base/12-taxcalc-worker.deployment.yaml - the KEDA scale target (W6 D5 Task 1).
#
# The SAME image as taxcalc-api, run with SPRING_PROFILES_ACTIVE=k8s,worker:
# no HTTP server, consumes taxpayers.events on consumer group
# taxcalc-read-model-builder, re-projects the Mongo read model. One image and
# two run modes, so the worker is provably the same bytes as the api rather
# than a second build that drifts from it.
#
# `replicas` IS ABSENT FROM THIS FILE, AND THAT IS THE POINT
#
# KEDA owns the replica count from the moment the ScaledObject is created. It
# does not set the count itself - it creates a HorizontalPodAutoscaler behind
# the scenes and that HPA drives spec.replicas. Declaring `replicas: 0` here
# alongside it is the classic sync war: Argo CD reconciles the field back to
# the manifest value, the HPA writes it again from lag, and the two fight on
# every reconcile interval. Omitting the field entirely means Kubernetes
# defaults it once at creation and never asserts it again.
#
# The corollary for GitOps: Deployment.spec.replicas is already in
# ignoreDifferences on every generated Application (see
# argocd/applicationsets/taxcalc-api-envs.yaml) for exactly this reason on the
# api side. The same exclusion covers this Deployment.
#
# NO PROBES, DELIBERATELY
#
# The worker profile sets spring.main.web-application-type=none, so there is no
# servlet container, no port bound and no /actuator/health to probe. An
# httpGet probe here would fail closed and CrashLoopBackOff a perfectly healthy
# consumer; an exec probe would need a shell the distroless image does not
# have. Liveness for a Kafka consumer is "is it committing offsets", which is
# what the KEDA lag metric already answers from outside the pod - and answers
# better, because a pod can be alive and still not consuming.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxcalc-api-worker
  namespace: taxcalc-dev
  labels:
    app.kubernetes.io/name:       taxcalc-api-worker
    app.kubernetes.io/component:  worker
    app.kubernetes.io/part-of:    taxcalc
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: taxcalc-api-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name:       taxcalc-api-worker
        app.kubernetes.io/component:  worker
        app.kubernetes.io/part-of:    taxcalc
        app.kubernetes.io/managed-by: argocd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    65532   # the distroless UID from W5 D1
        fsGroup:      65532
      # Scale-to-zero means pods are created and destroyed constantly. 20s
      # rather than the 30s default: the only thing this pod has to finish on
      # SIGTERM is the in-flight record batch and its offset commit, and a long
      # grace period on a scale-down of fifteen pods is fifteen pods' worth of
      # cost doing nothing but waiting to be killed.
      terminationGracePeriodSeconds: 20
      containers:
        - name:  worker
          image: uptimecrew/taxcalc-api:0.1.3
          imagePullPolicy: IfNotPresent
          envFrom:
            # The SAME ConfigMap and Secret the api reads, so broker address,
            # datasource and Mongo URI cannot drift between the two run modes.
            - configMapRef: { name: taxcalc-api-config }
            - secretRef:    { name: taxcalc-api-secrets }
          env:
            # Overrides the ConfigMap's SPRING_PROFILES_ACTIVE. `k8s` is
            # layered under `worker`, never replaced by it: every in-cluster
            # hostname lives in the k8s profile, and `worker` alone would
            # leave this pod dialling localhost.
            - name:  SPRING_PROFILES_ACTIVE
              value: "k8s,worker"
            # Explicitly TRUE here, even though true is the default. This is
            # the flag the api Deployment sets to false so api pods do not
            # drain the lag KEDA scales this Deployment on; stating it on both
            # sides means a reader comparing the two env blocks sees the
            # difference is intentional rather than an omission. TaxcalcWorker
            # refuses to start if this is ever false.
            - name:  TAXCALC_READ_MODEL_LISTENER_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          # Smaller than the api's: no servlet container, no connection pool
          # sized for HTTP concurrency. The request matters more than usual
          # here because it is multiplied by up to maxReplicaCount - at 20
          # pods this Deployment's requests alone are 3 CPU and 6Gi, which is
          # what the Karpenter NodePool's `limits` in Task 4 exists to cap.
          resources:
            requests: { cpu: 150m, memory: 320Mi }
            limits:   {            memory: 768Mi }
