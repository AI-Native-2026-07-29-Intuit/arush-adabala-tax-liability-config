# base/55-taxcalc-api.pdb.yaml - the availability floor (W6 D5 Task 2, RUNNABLE).
#
# A PodDisruptionBudget constrains VOLUNTARY disruptions only. That distinction is the whole
# point of the object and is the thing most often misread:
#
#   Voluntary   (this PDB is consulted, and can block)
#     kubectl drain, a node upgrade, a Karpenter consolidation that repacks a node, a cluster
#     autoscaler scale-down, anything else going through the Eviction API.
#
#   Involuntary (this PDB is NOT consulted, and cannot help)
#     a node losing power, a kernel panic, an OOM kill, a Spot interruption's actual reclaim,
#     a kubelet crash.
#
# So this is not a durability guarantee. It is a promise that the PLATFORM will not take the
# service below two serving pods while doing its own housekeeping - which is exactly the case
# Task 4's Karpenter NodePool creates deliberately, by repacking underutilised nodes every time
# the HPA scales down.
#
# minAvailable: 2, PAIRED WITH THE HPA's minReplicas
#
# The two numbers in 50-taxcalc-api.hpa.yaml and this file move together, and both directions of
# mismatch are bugs:
#
#   PDB floor ABOVE the HPA floor - unsatisfiable at rest. Once the HPA scales to its minimum,
#   allowed disruptions pins at 0 and `kubectl drain` hangs forever on a node holding one of
#   these pods. The drain does not error; it retries politely and indefinitely, which during a
#   node upgrade looks like a stuck cluster rather than a misconfigured budget.
#
#   PDB floor BELOW the HPA floor - satisfiable but pointless. It permits the platform to take
#   the service to one pod, which is the single-point-of-failure the HPA floor exists to avoid.
#
# minAvailable, NOT maxUnavailable. With an HPA in play the two behave very differently:
# maxUnavailable is evaluated against the CURRENT replica count, so at 20 replicas a
# `maxUnavailable: 1` permits a drain to proceed pod by pod down to 19, 18, ... and the floor
# moves with the load. minAvailable is an absolute number and holds the same line whether the
# Deployment is at 2 replicas or 20.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: taxcalc-api-pdb
  namespace: taxcalc-dev
  labels:
    app.kubernetes.io/name:      taxcalc-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of:   taxcalc
spec:
  minAvailable: 2
  selector:
    # MUST match the Deployment's pod labels, not the Deployment's own labels. A PDB with a
    # selector that matches nothing is not an error and is not reported as unhealthy - it shows
    # ALLOWED DISRUPTIONS equal to the (zero) pods it covers and silently protects nothing. The
    # W5 D3 label scheme is app.kubernetes.io/name, not the reference layout's bare `app`.
    matchLabels:
      app.kubernetes.io/name: taxcalc-api
