# manifests/30-taxcalc-api.configmap.yaml - non-secret env.
# Plain key/value pairs. Hostnames are the in-cluster DNS names
# (..svc.cluster.local) and resolve to the matching Services - Postgres/
# Redis/Mongo are deployed by manifests/05-dev-dependencies.yaml (see that
# file's header and the `k8s` profile note in application.yml).
# Anything sensitive (passwords, API keys) belongs in the Secret, never here.

apiVersion: v1
kind: ConfigMap
metadata:
  name: taxcalc-api-config
  namespace: taxcalc-dev
  labels:
    app.kubernetes.io/name:       taxcalc-api
    app.kubernetes.io/component:  api
    app.kubernetes.io/part-of:    taxcalc
    app.kubernetes.io/managed-by: kubectl
data:
  SPRING_PROFILES_ACTIVE:          k8s
  LOGGING_LEVEL_ROOT:              INFO
  SERVER_PORT:                     "8080"
  SPRING_DATASOURCE_URL:           jdbc:postgresql://postgres.taxcalc-dev.svc.cluster.local:5432/taxcalc_dev
  SPRING_DATASOURCE_USERNAME:      taxcalc_dev
  SPRING_DATA_REDIS_HOST:          redis.taxcalc-dev.svc.cluster.local
  SPRING_DATA_REDIS_PORT:          "6379"
  SPRING_DATA_MONGODB_URI:         mongodb://mongo.taxcalc-dev.svc.cluster.local:27017/taxcalc_dev
  SPRING_KAFKA_BOOTSTRAP_SERVERS:  kafka.taxcalc-dev.svc.cluster.local:9092
  OTEL_EXPORTER_OTLP_ENDPOINT:     http://otelcol.taxcalc-dev.svc.cluster.local:4317
  OTEL_SERVICE_NAME:               taxcalc-api
