# base/kustomization.yaml
#
# The W5 D3 manifest set, copied verbatim out of the application repo
# (arush-adabala-tax-liability/manifests/) and kept identical across every
# environment. Everything that differs per environment - namespace, replica
# count, image tag, Spring profile, log level, Ingress host - is a patch in
# overlays/{dev,staging,prod}/, never an edit here.
#
# FOUR W5 D3 OBJECTS ARE DELIBERATELY ABSENT:
#
#   Namespace       - cluster-scoped. The AppProject sets
#                     `clusterResourceWhitelist: []` (full deny), so an
#                     Application in project `taxcalc` cannot create one.
#
#                     AND `CreateNamespace=true` DOES NOT RESCUE THIS, which
#                     was assumed and is false. Argo CD implements that option
#                     by injecting a Namespace into the sync task list, and the
#                     injected resource is checked against the SAME
#                     clusterResourceWhitelist. Measured with a scratch project
#                     carrying the identical `[]` deny, pointed at a namespace
#                     that did not exist:
#
#                       Namespace  taxcalc-nsproof  SyncFailed
#                         resource :Namespace is not permitted in project ...
#                       Phase: Failed
#
#                     and the namespace was still absent afterwards. So
#                     namespaces here are strictly platform-provisioned - see
#                     platform/00-namespaces.yaml - and adding a fourth
#                     environment means adding it there FIRST.
#   ResourceQuota   - named in the AppProject's `namespaceResourceBlacklist`.
#   LimitRange        Quota knobs are platform-team property: an app team that
#                     can raise its own quota does not have a quota.
#   Secret          - the W5 D3 file carries a PLACEHOLDER password, which was
#                     inert under `kubectl apply` (CI reseeded the Secret
#                     after applying) and is actively destructive under
#                     continuous reconciliation: the first sync wrote the
#                     placeholder over the real password and every api pod
#                     started failing Postgres auth. See
#                     platform/40-taxcalc-api.secret.yaml for the full
#                     write-up and the out-of-band procedure.
#
# All four live under platform/ and are applied out-of-band. See those files'
# headers and the repo README for the full reasoning.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 05-dev-dependencies.yaml
  - 10-taxcalc-api.deployment.yaml
  - 20-taxcalc-api.service.yaml
  - 30-taxcalc-api.configmap.yaml
  - 50-taxcalc-api.hpa.yaml
  - 60-taxcalc-api.ingress.yaml
  - 70-taxcalc-api.servicemonitor.yaml

# ---------------------------------------------------------------------------
# Sync waves - INTRA-Application ordering, applied here rather than in each
# overlay because the dependency order is a property of the manifest set and
# does not vary by environment.
#
# Not `commonAnnotations`, which is what the reference layout uses to put the
# Namespace in wave -1: commonAnnotations stamps EVERY resource, so annotating
# the whole overlay with one wave number orders nothing. Waves only do work
# when different resources carry different numbers.
#
# Wave -1: the config the api reads at boot (ConfigMap - the Secret is
#          out-of-band, see above) and the backing stores it dials (postgres,
#          redis, mongo). Argo CD does not
#          advance to wave 0 until every wave -1 resource is Synced and
#          Healthy, so on a first sync into an empty namespace the Deployment
#          is not even created until Postgres is Running. Without this the
#          Deployment races its own dependencies: the pods come up, fail the
#          datasource check, and crash-loop through the startupProbe's 150s
#          grace while the operator watches an unexplained Degraded app.
# Wave  0: everything else (Deployment, Service, Ingress, HPA,
#          ServiceMonitor) - Kubernetes resolves those among themselves.
#
# The ApplicationSet sets a wave on each generated APPLICATION too (dev=0,
# staging=1, prod=2). Those are a different axis: this file orders resources
# within one Application; that one orders Applications against each other.
# ---------------------------------------------------------------------------
patches:
  - target: { kind: ConfigMap, name: taxcalc-api-config }
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: taxcalc-api-config
        annotations:
          argocd.argoproj.io/sync-wave: "-1"

  - target: { kind: Deployment, name: postgres }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgres
        annotations:
          argocd.argoproj.io/sync-wave: "-1"

  - target: { kind: Deployment, name: redis }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis
        annotations:
          argocd.argoproj.io/sync-wave: "-1"

  - target: { kind: Deployment, name: mongo }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mongo
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
