# cfn/taxcalc-bootstrap-dev.yaml
# Generated by /cfn-author taxcalc --region us-east-1 --env dev
#
# Deploy:
#   aws cloudformation create-change-set --stack-name taxcalc-bootstrap-dev \
#     --change-set-name initial --change-set-type CREATE \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --template-body file://cfn/taxcalc-bootstrap-dev.yaml --region us-east-1
#   aws cloudformation describe-change-set ...
#   aws cloudformation execute-change-set ...
AWSTemplateFormatVersion: "2010-09-09"
Description: taxcalc bootstrap - artefact bucket + CFN deploy role.

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment.
  RetentionDays:
    Type: Number
    Default: 30
    MinValue: 7
    MaxValue: 3650
    Description: NoncurrentVersionExpiration in days for the bootstrap bucket.
  GitHubOrg:
    Type: String
    Default: AI-Native-2026-07-29-Intuit
    Description: GitHub org allowed to assume the deploy role.
  GitHubRepo:
    Type: String
    Default: arush-adabala-tax-liability-config
    Description: Repo allowed to assume the deploy role.

Resources:
  BootstrapBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "uptimecrew-taxcalc-bootstrap-${EnvName}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: alias/aws/s3
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref RetentionDays
      Tags:
        - {Key: Env, Value: !Ref EnvName}
        - {Key: Project, Value: taxcalc}

  BootstrapBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BootstrapBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !GetAtt BootstrapBucket.Arn
              - !Sub "${BootstrapBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  CfnDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: taxcalc-api-cfn-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main"
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:pull_request"
      Policies:
        - PolicyName: cfn-deploy-narrow
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CfnStackOps
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                  - cloudformation:DetectStackDrift
                  - cloudformation:DescribeStackDriftDetectionStatus
                  - cloudformation:DescribeStackResourceDrifts
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/taxcalc-*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/taxcalc-*"
              - Sid: BootstrapBucketRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt BootstrapBucket.Arn
                  - !Sub "${BootstrapBucket.Arn}/*"
              - Sid: PassStackRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/taxcalc-*"
      Tags:
        - {Key: Env, Value: !Ref EnvName}
        - {Key: Project, Value: taxcalc}

Outputs:
  BootstrapBucketName:
    Description: Bootstrap bucket name.
    Value: !Ref BootstrapBucket
    Export: {Name: !Sub "${AWS::StackName}-BucketName"}
  BootstrapBucketArn:
    Description: Bootstrap bucket ARN.
    Value: !GetAtt BootstrapBucket.Arn
    Export: {Name: !Sub "${AWS::StackName}-BucketArn"}
  CfnDeployRoleArn:
    Description: ARN GitHub Actions assumes via OIDC.
    Value: !GetAtt CfnDeployRole.Arn
    Export: {Name: !Sub "${AWS::StackName}-CfnDeployRoleArn"}
