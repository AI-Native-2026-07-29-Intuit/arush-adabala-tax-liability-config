# cfn/taxcalc-app-dev.yaml
# Generated by /cfn-author taxcalc --region us-east-1 --env dev
#
# Consumes taxcalc-network-dev's exports via !ImportValue. The DB master
# password is NEVER a Parameter (NoEcho or not) - it lives in Secrets Manager
# and is resolved at deploy time with {{resolve:secretsmanager:...}}.
#
# Deploy:
#   aws cloudformation create-change-set --stack-name taxcalc-app-dev \
#     --change-set-name initial --change-set-type CREATE \
#     --template-body file://cfn/taxcalc-app-dev.yaml --region us-east-1
#   aws cloudformation describe-change-set ...
#   aws cloudformation execute-change-set ...
AWSTemplateFormatVersion: "2010-09-09"
Description: taxcalc application stack - RDS Postgres + Secrets Manager.

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment.
  NetworkStackName:
    Type: String
    Default: taxcalc-network-dev
    Description: Name of the network stack whose exports we !ImportValue.
  DbInstanceClass:
    Type: String
    Default: db.t4g.small
    AllowedValues: [db.t4g.small, db.t4g.medium, db.m6g.large]
    Description: RDS instance size.

Resources:
  DbMasterSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "taxcalc/${EnvName}/db-master"
      Description: !Sub "taxcalc DB master credentials, ${EnvName}."
      GenerateSecretString:
        SecretStringTemplate: '{"username": "taxcalc_master"}'
        GenerateStringKey: password
        ExcludeCharacters: '"@/\'
        PasswordLength: 32
      Tags:
        - {Key: Env, Value: !Ref EnvName}
        - {Key: Project, Value: taxcalc}

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "taxcalc ${EnvName} private subnets"
      SubnetIds:
        !Split
          - ","
          - !ImportValue
              "Fn::Sub": "${NetworkStackName}-PrivateSubnets"
      Tags:
        - {Key: Env, Value: !Ref EnvName}
        - {Key: Project, Value: taxcalc}

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "taxcalc ${EnvName} DB SG (5432 from app SG only)."
      VpcId:
        !ImportValue
          "Fn::Sub": "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId:
            !ImportValue
              "Fn::Sub": "${NetworkStackName}-AppSgId"
          Description: Postgres from app SG only.
      Tags:
        - {Key: Name, Value: !Sub "taxcalc-${EnvName}-db-sg"}

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceIdentifier: !Sub "taxcalc-${EnvName}"
      Engine: postgres
      EngineVersion: "16.3"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      MasterUsername:
        "Fn::Sub": "{{resolve:secretsmanager:taxcalc/${EnvName}/db-master:SecretString:username}}"
      MasterUserPassword:
        "Fn::Sub": "{{resolve:secretsmanager:taxcalc/${EnvName}/db-master:SecretString:password}}"
      Tags:
        - {Key: Env, Value: !Ref EnvName}
        - {Key: Project, Value: taxcalc}

  SecretTargetAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbMasterSecret
      TargetId: !Ref DbInstance
      TargetType: AWS::RDS::DBInstance

Outputs:
  DbEndpoint:
    Description: RDS endpoint address.
    Value: !GetAtt DbInstance.Endpoint.Address
    Export: {Name: !Sub "${AWS::StackName}-DbEndpoint"}
  DbSecretArn:
    Description: ARN of the master-credentials secret.
    Value: !Ref DbMasterSecret
    Export: {Name: !Sub "${AWS::StackName}-DbSecretArn"}
