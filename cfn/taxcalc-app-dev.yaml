# cfn/taxcalc-app-dev.yaml
#
# TASK 3 application stack: an RDS PostgreSQL instance, its subnet group and
# security group, and the Secrets Manager secret holding the master
# credentials. Consumes the network stack's exports via !ImportValue - subnet
# ids and the app SG id are never hardcoded here.
#
# Why !ImportValue rather than copied ids: a CFN export that is in use cannot
# be deleted, and the stack that owns it cannot be deleted either. That refusal
# ("Export taxcalc-network-dev-PrivateSubnets is in use by stack
# taxcalc-app-dev") is the whole point - a hardcoded subnet id gives you no
# such protection, it just goes stale the moment the network is rebuilt and
# fails at resource-creation time with an error that names the subnet rather
# than the reason.
#
# The DB master password is NEVER a Parameter - not even with NoEcho: true.
# NoEcho masks the value in the console and in describe-stacks output, but the
# value still travels through the CreateStack API call, still sits in the
# ChangeSet, and is still readable by anyone who can call GetTemplateSummary
# on a stack created from a template that has it as a default. The password is
# generated by Secrets Manager, never leaves it, and is pulled in at deploy
# time with a {{resolve:secretsmanager:...}} dynamic reference - CFN passes the
# resolved value straight to the RDS API without storing it in stack state.
#
# Stateful resources (the secret and the instance) carry BOTH DeletionPolicy:
# Retain AND UpdateReplacePolicy: Retain.
AWSTemplateFormatVersion: "2010-09-09"
Description: taxcalc application stack - RDS Postgres + Secrets Manager.

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: >-
      Deployment environment. Selects the secret path and the DB identifier,
      and tags every resource.

  NetworkStackName:
    Type: String
    Default: taxcalc-network-dev
    Description: >-
      Name of the network stack whose exports this stack imports. Parameterised
      rather than hardcoded so a throwaway network can be stood up alongside
      the real one and pointed at without editing the template.

  DbInstanceClass:
    Type: String
    Default: db.t4g.small
    AllowedValues: [db.t4g.small, db.t4g.medium, db.m6g.large]
    Description: >-
      RDS instance size. The allow-list is a cost guard as much as a
      correctness one - it makes db.m5.24xlarge a rejected ChangeSet rather
      than a surprise on the monthly bill.

  DbEngineVersion:
    Type: String
    Default: "16.3"
    Description: >-
      PostgreSQL engine version. A Parameter and not a literal because AWS
      deprecates minor versions on its own schedule: when this one goes away
      the fix is a --parameters override on the next ChangeSet, not a template
      edit and a PR. Check `aws rds describe-db-engine-versions --engine
      postgres` for what the account can currently create.

Resources:
  # --- Secrets Manager secret: the DB master credentials.
  # GenerateSecretString is the point - CFN never sees the password, only the
  # secret's ARN. Anyone holding cloudformation:DescribeStacks or
  # GetTemplate on this stack learns nothing; reading the value needs a
  # separate secretsmanager:GetSecretValue grant on this specific secret.
  DbMasterSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W77
            reason: >-
              No KmsKeyId, so the secret is encrypted under the AWS-managed
              aws/secretsmanager key. The two things a customer-managed key
              buys - cross-account sharing and revoking access by key policy
              rather than by IAM - have no consumer today: the only readers
              are in this account. Adding a CMK now would mean a key, a key
              policy and a standing monthly charge to protect a value that is
              already encrypted at rest. This becomes wrong the moment
              External Secrets Operator reads it from another account, which
              is tracked in taxcalc-api/INFRA.md.
    Properties:
      Name: !Sub "taxcalc/${EnvName}/db-master"
      Description: !Sub "taxcalc DB master credentials, ${EnvName}."
      GenerateSecretString:
        SecretStringTemplate: '{"username": "taxcalc_master"}'
        GenerateStringKey: password
        # Excluded because they are the characters that break a Postgres
        # connection URI (or the shell quoting around one) rather than for
        # any strength reason; length is what carries the entropy here.
        ExcludeCharacters: '"@/\'
        PasswordLength: 32
      Tags:
        - {Key: Env, Value: !Ref EnvName}
        - {Key: Project, Value: taxcalc}

  # --- DB subnet group spanning the private subnets imported from the network
  # stack. !Split + !ImportValue is the cross-stack pattern for a set: CFN
  # exports cannot hold a List, so the network stack joins the three ids and
  # this stack splits them back apart.
  #
  # Each element is !Select over that !Split rather than handing the bare
  # !Split to SubnetIds. Both spellings are valid CloudFormation and both
  # resolve to the same three ids; this one is written as a real YAML list of
  # three scalars, which is the form floci's engine can actually resolve into
  # a list-typed property (it drops a whole-list function used as the property
  # value - see INFRA.md). Nothing is hardcoded either way: the ids still come
  # only from the network stack's PrivateSubnets export.
  #
  # The cost is that the count is pinned at three. That matches the network
  # stack, which builds exactly one private subnet per AZ across three AZs;
  # if that ever becomes variable, this is the line that has to change.
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "taxcalc ${EnvName} private subnets"
      SubnetIds:
        - !Select
            - 0
            - !Split
                - ","
                - !ImportValue
                    "Fn::Sub": "${NetworkStackName}-PrivateSubnets"
        - !Select
            - 1
            - !Split
                - ","
                - !ImportValue
                    "Fn::Sub": "${NetworkStackName}-PrivateSubnets"
        - !Select
            - 2
            - !Split
                - ","
                - !ImportValue
                    "Fn::Sub": "${NetworkStackName}-PrivateSubnets"
      Tags:
        - {Key: Env, Value: !Ref EnvName}
        - {Key: Project, Value: taxcalc}

  # --- DB security group: ingress 5432 only from the app SG, by id.
  # SourceSecurityGroupId (not a CIDR) is what makes this tight: membership of
  # the app SG is the credential, so a box that merely sits in the same subnet
  # range still cannot open a Postgres connection.
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "taxcalc ${EnvName} DB SG (5432 from app SG only)."
      VpcId:
        !ImportValue
          "Fn::Sub": "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId:
            !ImportValue
              "Fn::Sub": "${NetworkStackName}-AppSgId"
          Description: Postgres from app SG only.
      # Egress is stated explicitly because leaving it out is NOT "no egress" -
      # CFN falls back to the default allow-all rule, and this database would
      # be able to open outbound connections anywhere on the internet. Nothing
      # about a managed RDS instance needs that: it accepts connections, it
      # does not make them (backups, patching and monitoring all travel over
      # the AWS-managed control plane, not this security group).
      #
      # There is no way to express "no egress at all" in CFN - an empty list
      # is treated as unset and restores the allow-all default - so the
      # narrowest expressible rule stands in for it. 127.0.0.1/32 is
      # unroutable from the ENI, which makes this rule inert by construction
      # while still being a rule, which is what suppresses the default.
      # (cfn-nag F1000 fires on exactly this omission.)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 127.0.0.1/32
          Description: No egress required; placeholder to displace allow-all.
      Tags:
        - {Key: Name, Value: !Sub "taxcalc-${EnvName}-db-sg"}
        - {Key: Env, Value: !Ref EnvName}
        - {Key: Project, Value: taxcalc}

  # --- The RDS instance itself. Stateful: Retain on BOTH policies.
  #
  # DependsOn: DbMasterSecret is load-bearing and easy to miss. The
  # {{resolve:secretsmanager:...}} strings below are opaque literals as far as
  # CFN's dependency graph is concerned - it does not parse them and therefore
  # does not know this resource needs the secret to exist first. Without the
  # explicit DependsOn, CFN is free to create the instance in parallel with the
  # secret, and the deploy fails intermittently on a secret that "does not
  # exist" moments before it does.
  DbInstance:
    Type: AWS::RDS::DBInstance
    DependsOn: DbMasterSecret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              The explicit DBInstanceIdentifier is kept on purpose. It is the
              handle every operational path uses - describe-db-instances,
              snapshot and restore names, console search, CloudWatch metric
              dimensions - and a CFN-generated identifier would change those
              on every replacement. W28's underlying warning does not really
              bite here: DeletionProtection is on and both Retain policies are
              set, so a replacing update is meant to be a deliberate,
              hand-driven operation rather than something a ChangeSet does
              quietly.
    Properties:
      DBInstanceIdentifier: !Sub "taxcalc-${EnvName}"
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      # MultiAZ is off in dev on cost grounds - it roughly doubles the
      # instance charge to protect a database that is rebuilt from migrations
      # on demand. staging/prod override this on the ChangeSet.
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      # Dynamic resolution - the curriculum-correct master-credential pattern.
      # Fn::Sub is needed (not a plain string) only because the secret path
      # itself is parameterised by EnvName.
      MasterUsername:
        "Fn::Sub": "{{resolve:secretsmanager:taxcalc/${EnvName}/db-master:SecretString:username}}"
      MasterUserPassword:
        "Fn::Sub": "{{resolve:secretsmanager:taxcalc/${EnvName}/db-master:SecretString:password}}"
      Tags:
        - {Key: Env, Value: !Ref EnvName}
        - {Key: Project, Value: taxcalc}

  # --- Secret-to-DB attachment: rotation can target the live DB ARN.
  # It also backfills the connection details (host, port, engine) into the
  # secret's JSON, so a consumer reads one secret instead of a secret plus a
  # separately-plumbed endpoint that can disagree with it after a failover.
  SecretTargetAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbMasterSecret
      TargetId: !Ref DbInstance
      TargetType: AWS::RDS::DBInstance

Outputs:
  DbEndpoint:
    Description: RDS endpoint address for the application's datasource URL.
    Value: !GetAtt DbInstance.Endpoint.Address
    Export: {Name: !Sub "${AWS::StackName}-DbEndpoint"}

  DbSecretArn:
    Description: >-
      ARN of the master-credentials secret. Exported as the ARN, never the
      value - this is what an ExternalSecret or IRSA-scoped policy points at.
    Value: !Ref DbMasterSecret
    Export: {Name: !Sub "${AWS::StackName}-DbSecretArn"}

  DbSecurityGroupId:
    Description: DB security group id, for any later stack needing DB reach.
    Value: !Ref DbSecurityGroup
    Export: {Name: !Sub "${AWS::StackName}-DbSgId"}
