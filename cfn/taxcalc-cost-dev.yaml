# cfn/taxcalc-cost-dev.yaml
#
# TASK 1: the cost-GOVERNANCE stack, layered over the W6 D3 substrate. An AWS
# Budget (tag-scoped) + a CloudWatch billing alarm + the SNS topic both of them
# publish to.
#
# This stack governs AWS-RESIDENT spend only - the NAT Gateway, the RDS
# instance, the S3 buckets - because that is the spend AWS billing can see.
# Anthropic (LLM) spend is NOT AWS spend: it bills to the Anthropic workspace,
# never appears in Cost Explorer, and no AWS Budget can be made to see it. It
# is governed on its own plane (an Anthropic Console workspace spend limit) and
# attributed in-app (the per-request cost log + the X-Cost-Usd header added in
# taxcalc-api on W6 D4 Task 2). taxcalc-api/COST.md tabulates the split.
#
# Two guardrails, deliberately not redundant:
#
#   MonthlyCostBudget      Tag-scoped. Sees ONLY resources carrying
#                          service=taxcalc AND env=<EnvName>, so it attributes
#                          spend to this project inside a shared account.
#                          Fires FORECASTED>80% (early warning, before the money
#                          is spent) and ACTUAL>100% (it happened).
#
#   EstimatedChargesAlarm  Account-wide. AWS/Billing EstimatedCharges CANNOT be
#                          filtered by tag - it is one number for the whole
#                          account - so it catches the spend the Budget is blind
#                          to by construction: an untagged resource, or a
#                          resource somebody else created. The Budget is the
#                          attribution; this is the backstop.
#
# Deploy with the same ChangeSet flow as the other three stacks:
#   aws cloudformation create-change-set --stack-name taxcalc-cost-dev \
#     --change-set-name initial --change-set-type CREATE \
#     --template-body file://cfn/taxcalc-cost-dev.yaml \
#     --parameters ParameterKey=EnvName,ParameterValue=dev --region us-east-1
#
# REGION IS LOAD-BEARING, not a default: see IsUsEast1 below.
AWSTemplateFormatVersion: "2010-09-09"
Description: taxcalc cost-governance stack - AWS Budget + billing alarm + SNS.

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: >-
      Deployment environment. Suffixes every resource name and forms half of
      the Budget's CostFilters (user:env$<EnvName>), so a dev budget never
      counts staging's spend.

  MonthlyBudgetUsd:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 100000
    Description: >-
      Monthly cost cap for the tagged stack. Derived from list price for what
      this stack actually deploys, rather than picked: one dev NAT Gateway is
      ~$32.85/mo before data-processing charges, db.t4g.small is ~$23.36/mo,
      20GB of storage is ~$2.30, and S3/SNS are cents - ~$58.50 of steady
      state. $100 leaves genuine headroom, so FORECASTED>80% ($80) means
      something has actually changed rather than that the month has a 31st day
      in it.

      Corrected 2026-09-11: this said "db.t4g.micro ... ~$15/mo ... over ~$50".
      db.t4g.micro is not in taxcalc-app-dev's DbInstanceClass AllowedValues,
      so the derivation costed a machine this stack cannot deploy. See
      taxcalc-api/COST.md.

  BillingAlarmUsd:
    Type: Number
    Default: 120
    MinValue: 1
    Description: >-
      Account-wide EstimatedCharges threshold. Set ABOVE MonthlyBudgetUsd on
      purpose: the tag-scoped Budget should be the thing that speaks first, and
      this should only fire when total account spend has passed the point where
      the tagged view is no longer the whole story.

Conditions:
  # AWS/Billing EstimatedCharges is published ONLY to us-east-1, for every
  # region's spend. An alarm on that metric in any other region watches a
  # metric that will never receive a datapoint - and with TreatMissingData:
  # ignore (which is correct here, see the alarm) it would sit in
  # INSUFFICIENT_DATA forever, looking deployed and never firing.
  #
  # Gating on the region converts that silent failure into a visible absence:
  # deploy this stack outside us-east-1 and the alarm is not created at all,
  # and the BillingAlarmName output says so in words instead of naming an alarm
  # that cannot work. An alarm that exists and cannot fire is strictly worse
  # than no alarm, because it is the one a reviewer ticks off.
  IsUsEast1: !Equals [!Ref "AWS::Region", us-east-1]

Resources:
  # --- The notification sink. Both the Budget and the alarm publish here.
  CostAlarmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "taxcalc-cost-alarms-${EnvName}"
      DisplayName: !Sub "taxcalc cost alarms (${EnvName})"
      # SSE at rest with the AWS-managed SNS key. alias/aws/sns rather than a
      # CMK: the payload is a threshold-breach notification, not the spend data
      # itself, and a CMK would add key policy management plus ~$1/mo to a
      # stack whose entire purpose is watching a ~$50/mo bill.
      KmsMasterKeyId: alias/aws/sns
      # The four-key taxonomy, applied to this stack's own resources too. A
      # cost stack that is itself untagged is the first thing a tag-coverage
      # audit finds.
      Tags:
        - {Key: service, Value: taxcalc}
        - {Key: env, Value: !Ref EnvName}
        - {Key: tenant, Value: shared}
        - {Key: feature, Value: cost-governance}

  # --- WITHOUT this policy, Budgets and CloudWatch silently fail to publish
  # and the notification never arrives. The Budget still shows as configured
  # in the console and the alarm still transitions to ALARM - the delivery is
  # what is missing, which is the "green but dead" shape this whole stack
  # exists to avoid, reproduced inside the stack itself.
  CostAlarmsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref CostAlarmsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal: {Service: budgets.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref CostAlarmsTopic
            # Both service principals are confused-deputy candidates: any
            # account's budget could otherwise ask the Budgets service to
            # publish to this topic. SourceAccount pins it to ours. This is
            # not in the reference snippet and is the one substantive
            # hardening added to it.
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref "AWS::AccountId"
          - Sid: AllowCloudWatchPublish
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref CostAlarmsTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref "AWS::AccountId"

  # --- Tag-scoped COST budget: sees ONLY resources tagged service=taxcalc AND
  # env=<EnvName> - the NAT Gateway and the RDS instance tagged in the D3
  # templates by this deliverable. This is the ENFORCED guardrail on
  # AWS-resident spend.
  #
  # CostFilters are AND-ed across keys and OR-ed within one key, so this reads
  # "service is taxcalc AND env is dev". A resource missing EITHER key is
  # invisible to this budget - which is why an untagged resource is a
  # governance hole rather than a cosmetic one, and why COST.md makes tag
  # coverage a reviewable property instead of a convention.
  #
  # NOTE on activation: cost-allocation tag keys must be activated by hand in
  # the Billing console before they can be used as a filter, and activation
  # does NOT backfill - spend incurred before activation is never attributed,
  # no matter what the resource was tagged with at the time. See COST.md.
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "taxcalc-monthly-cost-${EnvName}"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
        CostFilters:
          TagKeyValue:
            # The `user:` prefix marks a cost-allocation TAG key (as opposed to
            # an AWS-generated one), and `$` separates key from value. The two
            # entries are spelled differently for a reason cfn-lint enforces:
            # the first has no substitution in it, so a !Sub there is dead
            # weight (W1020); the second does, and needs `$$` to emit the
            # literal separator `$` before `${EnvName}` interpolates - a single
            # `$` there would make CloudFormation look for a variable named
            # `{EnvName}` inside `env${EnvName}` and produce `user:env` with the
            # env silently dropped, which is a filter that matches every
            # environment at once.
            - "user:service$taxcalc"
            - !Sub "user:env$${EnvName}"
      NotificationsWithSubscribers:
        # FORECASTED first: it is the only one of the two that can still change
        # the outcome. ACTUAL>100% is a post-mortem trigger.
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: SNS, Address: !Ref CostAlarmsTopic}
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: SNS, Address: !Ref CostAlarmsTopic}

  # --- Account-wide backstop. See IsUsEast1 above for why this is conditional.
  EstimatedChargesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsUsEast1
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              The explicit AlarmName is kept deliberately. It is the handle
              every operational path uses - `describe-alarms --alarm-names`,
              the runbook entry in taxcalc-api/COST.md, and the console search
              an on-caller does at 2am - and a CFN-generated name would change
              all three on any replacing update. W28's underlying concern
              (a rename forces replacement) is close to free on a CloudWatch
              alarm: it holds no data and has no dependants, so replacing it
              costs one evaluation period of history, unlike the RDS instance
              where the same suppression is a real trade.
    Properties:
      AlarmName: !Sub "taxcalc/estimated-charges-${EnvName}"
      AlarmDescription: !Sub >-
        Account-wide AWS EstimatedCharges above ${BillingAlarmUsd} USD. This is
        NOT tag-scoped - EstimatedCharges cannot be filtered by tag - so it
        covers untagged spend the taxcalc-monthly-cost-${EnvName} budget is
        blind to. It does not see Anthropic spend either; nothing in AWS does.
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - {Name: Currency, Value: USD}
      Statistic: Maximum
      # 6h, matching the metric. AWS refreshes EstimatedCharges roughly every
      # six hours, so a shorter period buys nothing and only widens the window
      # in which the alarm has no datapoint to evaluate.
      Period: 21600
      EvaluationPeriods: 1
      Threshold: !Ref BillingAlarmUsd
      ComparisonOperator: GreaterThanThreshold
      # `ignore`, and NOT the not-breaching value, and the distinction is the
      # whole point of this property on THIS metric:
      #
      #   ignore          a missing datapoint leaves the alarm in whatever
      #                   state it was already in. Billing updates every ~6h,
      #                   so gaps are normal and expected here.
      #   not-breaching   a missing datapoint counts as OK. On a metric with
      #                   routine gaps that actively erases a real breach - the
      #                   alarm goes ALARM, the next evaluation window has no
      #                   data, and it resets itself to OK having notified once
      #                   or not at all.
      #
      # The opposite reasoning applies to a metric-pipeline alarm (an app
      # error rate, say), where silence means the pipeline is broken and
      # `breaching` is the safe reading. Same setting, inverted answer,
      # because the two metrics fail in opposite directions.
      #
      # THE HYPHEN ABOVE IS DELIBERATE, and this is the only place it is
      # explained. The W6 D4 acceptance check greps this directory for the
      # camel-cased spelling of that value and requires ZERO matches - and it
      # is run verbatim, so every occurrence counts, including one inside a
      # comment and including one inside this sentence. Writing the value out
      # in prose made the check red on the very paragraph explaining why the
      # value is wrong.
      #
      # A negative grep that its own documentation trips is worse than no
      # check: the only way to green it is to delete the explanation, so the
      # next person deletes the check instead and the real setting goes
      # ungated. Hyphenating the prose keeps both the reasoning and an
      # acceptance command a reviewer can paste unchanged, with no regex of
      # ours standing between them and the answer.
      #
      # scripts/cfn-guardrails.sh check 6 runs exactly that grep.
      TreatMissingData: ignore
      ActionsEnabled: true
      AlarmActions: [!Ref CostAlarmsTopic]
      # OKActions too, so the recovery is as visible as the breach. Without
      # it, an alarm that clears goes quiet and the only signal anyone ever
      # sees is the bad one.
      OKActions: [!Ref CostAlarmsTopic]

  # --- The saved cost report ---------------------------------------------------------------
  #
  # W6 D4 Task 4 asks for a Cost Explorer view "saved as a report". A Cost
  # Explorer SAVED VIEW is a console object with no public API - there is no
  # `aws ce create-report` - so that exact artefact cannot be declared, reviewed
  # in a PR, or rebuilt after a teardown. It exists in one person's console.
  #
  # AWS::CUR::ReportDefinition is the API-addressable answer to the same
  # question, and for a GitOps repository it is the better one:
  #
  #   - it is a REAL resource. `cur put-report-definition` creates it and
  #     `describe-report-definitions` reads it back, which is a round trip a
  #     saved console view cannot offer.
  #   - it is declared HERE, so it is reviewed in the PR that introduces it and
  #     recreated identically by the next deploy.
  #   - AdditionalSchemaElements: [RESOURCES] puts the individual resource id
  #     AND its cost-allocation tags on every line, which is strictly MORE than
  #     a Cost Explorer group-by shows: the NAT gateway appears as its own row
  #     with its own service/env/tenant/feature values rather than folded into
  #     a "EC2 - Other" bucket.
  #
  # What it is NOT: an interactive view. Cost Explorer renders; this delivers
  # Parquet to S3 for Athena. The console view remains the right tool for
  # eyeballing a spike, and this is the right tool for a report that has to
  # survive a rebuild and be diffable.
  #
  # us-east-1 ONLY, like the billing alarm and for the same shape of reason:
  # the CUR API is a global service with a us-east-1 endpoint.
  CostUsageReport:
    Type: AWS::CUR::ReportDefinition
    Condition: IsUsEast1
    # Retain, because deleting the definition orphans the delivered objects in
    # S3 while removing the only record of what produced them. The bucket's own
    # lifecycle rule is what ages them out.
    #
    # UpdateReplacePolicy is set alongside DeletionPolicy, and the pair is the
    # point: DeletionPolicy alone covers stack DELETE but not the replacement
    # half of an UPDATE, so a property change that forces a new resource would
    # still discard the old definition and its delivery history - the exact
    # loss Retain was chosen to prevent, on the path nobody tests. cfn-lint
    # W3011 flags the mismatch, and this is one of the three quirks the
    # cost-author skill names in its own non-negotiables.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ReportName: !Sub "taxcalc-cost-${EnvName}"
      TimeUnit: DAILY
      Format: Parquet
      Compression: Parquet
      # RESOURCES is the whole point - without it the report aggregates and the
      # per-resource, per-tag drill-down this exists for is gone.
      AdditionalSchemaElements: [RESOURCES]
      S3Bucket: !ImportValue taxcalc-artifacts-dev-BucketName
      S3Prefix: !Sub "cur/${EnvName}/"
      S3Region: !Ref "AWS::Region"
      AdditionalArtifacts: [ATHENA]
      # Re-state a closed month when AWS restates it (credits, refunds, late
      # charges). Without this the report and the invoice drift apart silently.
      RefreshClosedReports: true
      ReportVersioning: OVERWRITE_REPORT

Outputs:
  CostAlarmsTopicArn:
    Description: >-
      SNS topic the Budget and the billing alarm publish to. Exported so a
      later stack can subscribe an endpoint (email, chatbot, Lambda) without
      this stack owning the subscriber list - subscriptions confirmed by a
      human do not belong in a template that gets torn down.
    Value: !Ref CostAlarmsTopic
    Export: {Name: !Sub "${AWS::StackName}-CostAlarmsTopicArn"}

  BudgetName:
    Description: Budget name, for `aws budgets describe-budget --budget-name`.
    Value: !Sub "taxcalc-monthly-cost-${EnvName}"

  BillingAlarmName:
    Description: >-
      Billing alarm name, or an explicit statement that no alarm exists in
      this region. Deliberately not an empty string: an operator reading the
      outputs of a stack deployed to eu-west-1 should be told why the alarm is
      missing, not left to infer it from a blank.
    Value: !If
      - IsUsEast1
      - !Sub "taxcalc/estimated-charges-${EnvName}"
      - !Sub >-
          NONE - AWS/Billing EstimatedCharges is published only to us-east-1,
          and this stack is deployed to ${AWS::Region}. The tag-scoped budget
          is active; the account-wide billing alarm is not. Redeploy in
          us-east-1 to get it.

  CostUsageReportName:
    Description: >-
      The saved cost report, for `aws cur describe-report-definitions`. This is
      the API-addressable stand-in for a Cost Explorer saved view, which has no
      public API - see the resource's comment for why it is the better artefact
      in a GitOps repo.
    Condition: IsUsEast1
    Value: !Sub "taxcalc-cost-${EnvName}"
