# overlays/dev/kustomization.yaml
#
# The dev overlay - the smallest viable patch over the W5 D3 base. The same
# shape repeats at overlays/staging/ and overlays/prod/ with a different
# namespace, replica count, Spring profile, log level and Ingress host; the
# image tag is bumped in THIS overlay only, by CI (see below).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The unchanged W5 D3 manifests, copied verbatim into k8s/taxcalc-api/. Identical across
# every environment - if a change belongs in all three, it belongs there.
resources:
  - ../../k8s/taxcalc-api

# Per-env namespace. Kustomize rewrites every resource's metadata.namespace at
# build time, so the base files' own `namespace: taxcalc-dev` lines are
# overwritten rather than respected - which is why k8s/taxcalc-api/ can stay a verbatim
# copy of the W5 D3 originals instead of being stripped of them.
namespace: taxcalc-dev

# Image-tag rewrite. `.github/workflows/_bump-config.yml` in the application
# repo runs `kustomize edit set image` against THIS file on every green build
# of main, then opens a PR here. Do not hand-edit newTag; a human edit and the
# bot's next rewrite will collide in the same three lines.
#
# The committed value is a real tag that exists in the cluster's image store
# rather than the reference layout's `1f1f1f1f...` placeholder: a placeholder
# tag resolves to ImagePullBackOff, which makes the Application permanently
# Degraded and turns the deliberate-failure experiment in Task 4 into noise
# that cannot be told apart from the failure being tested.
#
# W6 D5: THIS TAG IS NOT A CI ARTEFACT, AND THE NAME SAYS SO ON PURPOSE
#
# The note below used to read "this is THE IMAGE CI ACTUALLY PUSHED, not a
# local rebuild". That is no longer true of this line and the exception is
# deliberate, temporary, and load-bearing for Task 2.
#
# Every image CI has published predates W6 D5. `InflightRequestsGauge` - the
# Micrometer gauge the SLO-derived HPA scales on - lives on the application
# repo's `w6d5-implementation` branch, which has not merged, so the newest
# published tag (5806c4ec / `main`, the W6 D4 merge) does not contain it.
# Verified against the previously-pinned tag rather than assumed:
#
#   $ curl -s localhost:8080/actuator/prometheus | grep -c inflight
#   0
#
# Pinning an image without the gauge is not a cosmetic mismatch. The HPA reads
# `<unknown>`, and an HPA whose metric is unreadable does not fail or alert -
# it HOLDS its replica count. So Task 2 would have been "correct manifests,
# frozen autoscaler", with every surface reporting health.
#
# `w6d5-local-acef557` is therefore a REAL, PULLABLE GHCR tag built from
# application-repo commit acef557 and pushed by hand. The `-local-` infix is
# the whole point: this image is linux/arm64 (CI publishes linux/amd64) and was
# built with the corporate TLS-interception CA injected into the Gradle stage,
# because `./gradlew bootJar` inside the build container cannot otherwise reach
# Maven Central here (`PKIX path building failed`). It is NOT byte-comparable
# to what CI will produce and must never be mistaken for it.
#
# THE EXIT PATH IS THE NORMAL ONE. Merge the application branch;
# `_build-and-push.yml` publishes a real CI image and `_bump-config.yml`
# rewrites this `newTag` to the commit SHA, overwriting this exception without
# anyone having to remember it. Until then, this is the only tag for which the
# manifest half and the application half of Task 2 are true together.
#
# TWO THINGS MAKE THIS WORK ON A LAPTOP, AND BOTH ARE WORTH KNOWING BEFORE
# ANYONE COPIES THIS INTO A REAL CLUSTER:
#
#   1. The GHCR package is PRIVATE, and org policy blocks changing package
#      visibility (recorded in the app repo's .github/PIPELINE.md). A real
#      cluster therefore cannot pull this reference at all without an
#      imagePullSecret holding a long-lived PAT - which sits badly beside the
#      OIDC / no-long-lived-credentials premise the pipeline just established.
#      The k3d lab sidesteps it entirely by SIDE-LOADING: the image is pulled
#      on the host (where docker is already authenticated) and pushed into the
#      nodes' image stores with `k3d image import`, so the kubelet never
#      contacts a registry. `imagePullPolicy: IfNotPresent` in the base is what
#      makes that work.
#
#   2. CI publishes linux/amd64 ONLY, and k3d nodes on Apple Silicon are
#      arm64. A CI image runs anyway because the Rancher Desktop VM has binfmt
#      registered, so containerd executes it under emulation - verified with a
#      throwaway pod (`java -version` from the image's own jlinked JRE returned
#      Temurin 21.0.12 on an arm64 node). It is EMULATED, so it is slower than
#      a native build; that is acceptable for a lab and is not acceptable for
#      anything measuring latency. The real fix is a multi-arch build
#      (`platforms: linux/amd64,linux/arm64`) in _build-and-push.yml, which is
#      not free here - the Dockerfile's builder stage runs Gradle and the jlink
#      stage builds a custom JRE, both slow under QEMU.
#
#      THIS DOES NOT APPLY TO THE TAG CURRENTLY PINNED. `w6d5-local-acef557`
#      was built on the host and is NATIVE arm64, so nothing about it is
#      emulated. That makes it faster than the CI images every latency number
#      before W6 D5 was measured on - worth knowing before comparing a p99 from
#      this tag against an older one, and another reason the `-local-` infix
#      matters. When CI's amd64 image replaces it on merge, the paragraph above
#      becomes true again.
#
# Reproduce the side-load with:
#   docker pull --platform linux/amd64 ghcr.io/ai-native-2026-07-29-intuit/taxcalc-api:<sha>
#   k3d image import -c taxcalc ghcr.io/ai-native-2026-07-29-intuit/taxcalc-api:<sha>
#   # ...and once per agent node - `-c` imported into the server node only here
images:
  - name:    uptimecrew/taxcalc-api
    newName: ghcr.io/ai-native-2026-07-29-intuit/taxcalc-api
    newTag:  "w6d5-local-acef557"

# Per-env replica count. dev runs hot at one replica.
#
# The HPA in k8s/taxcalc-api/ has minReplicas: 2, so it will scale this back up to 2
# within a reconcile - and because the Application sets selfHeal: true, Argo
# CD would then fight the HPA over the same field forever. `Deployment.spec
# .replicas` is therefore in ignoreDifferences on every generated Application
# (see argocd/applicationsets/taxcalc-api-envs.yaml): Git owns the initial
# value, the HPA owns it thereafter, and Argo CD stops calling the HPA's work
# drift. This is the one field where "Git is the source of truth" is wrong.
replicas:
  - name:  taxcalc-api
    count: 2

# Per-env config patch - override the W5 D3 ConfigMap entries that should
# differ between environments (Spring profile, log level).
#
# SPRING_PROFILES_ACTIVE stays "k8s,dev" rather than the reference layout's
# bare "dev": application.yml only defines documents for `docker`, `k8s` and
# `test`, and the k8s document is what supplies the in-cluster datasource,
# Redis, Mongo and Kafka coordinates. Replacing it with `dev` would leave the
# app on its default (localhost) datasource and it would never start. The
# extra `dev` profile matches no document today and is there so that a future
# `on-profile: dev` block has somewhere to land.
#
# LOGGING_LEVEL_ROOT is the key the base actually uses, not the reference
# layout's LOG_LEVEL - Spring Boot's relaxed binding maps it to
# logging.level.root; a LOG_LEVEL key would be read by nothing.
patches:
  - target: { kind: ConfigMap, name: taxcalc-api-config }
    patch: |
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: "k8s,dev"
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: "DEBUG"

  # Per-env Ingress host. All three environments share one ingress-nginx on
  # the k3d cluster, so the host header is the only thing separating them.
  # HPA floor, patched per env to MATCH the replica count above.
  #
  # k8s/taxcalc-api/hpa.yaml sets minReplicas: 2 for every environment,
  # which silently overrides `replicas:` here: the HPA scales the Deployment
  # back up to its own floor within a reconcile, and because
  # Deployment.spec.replicas is in ignoreDifferences, Argo CD reports Synced
  # while the live replica count disagrees with Git. dev asked for 1 and ran 2.
  #
  # Aligning the floor with the overlay's replica count is what makes Git and
  # the HPA agree at rest. ignoreDifferences is still correct and still needed
  # - it is what lets the HPA scale UP under load without Argo CD calling that
  # drift - but the two no longer contradict each other at the floor.
  # W6 D5 Task 2: the floor moves BACK UP to 2, and the `replicas: 1` above with it.
  #
  # The note above describes aligning the HPA floor with dev's single replica so Git and the HPA
  # agreed at rest. That reasoning was right and its conclusion is now wrong, because
  # pdb.yaml introduces a third party: a PodDisruptionBudget with minAvailable: 2.
  #
  # A PDB floor above the HPA floor is unsatisfiable at rest. At one replica, allowed disruptions
  # pins at 0 and `kubectl drain` on the node holding that pod hangs indefinitely - not with an
  # error, but politely retrying, which during a node upgrade looks like a stuck cluster rather
  # than a misconfigured budget. Task 4's Karpenter NodePool consolidates underutilised nodes on
  # exactly that path, so this is not hypothetical.
  #
  # So dev runs two replicas now. That is the cost of having a disruption budget that means
  # something, and it is the same number k8s/taxcalc-api/ and the PDB already agree on.
  - target: { kind: HorizontalPodAutoscaler, name: taxcalc-api-hpa }
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2

  - target: { kind: Ingress, name: taxcalc-api }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: taxcalc.dev.uptimecrew.internal
