spec:
  description: taxcalc-api across dev, staging and prod.

  # Enumerated, never '*'.
  sourceRepos:
    - https://github.com/AI-Native-2026-07-29-Intuit/arush-adabala-tax-liability-config.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: taxcalc-dev
