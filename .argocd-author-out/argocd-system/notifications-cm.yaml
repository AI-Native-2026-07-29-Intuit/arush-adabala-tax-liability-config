# Generated by argocd-author
#   /argocd-author taxcalc-api --namespace-prefix taxcalc --strategy canary --secrets-mode eso
#
# The credential is NOT in this file. Create it out-of-band:
#
#   kubectl -n argocd create secret generic argocd-notifications-secret \
#     --from-literal=slack-token="$SLACK_TOKEN"
#
# APPLY + RESTART: the controller reads this ConfigMap at startup and does not
# watch it, so `kubectl apply` alone changes nothing.
#
#   kubectl apply -f argocd-system/notifications-cm.yaml -n argocd
#   kubectl -n argocd rollout restart deploy/argocd-notifications-controller
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.slack: |
    token: $slack-token

  # ----- Triggers -----------------------------------------------------------
  trigger.on-sync-succeeded: |
    - description: Application syncing has succeeded.
      send:   [app-sync-succeeded]
      when:   app.status.operationState.phase in ['Succeeded']

  trigger.on-sync-failed: |
    - description: Application syncing has failed.
      send:   [app-sync-failed]
      when:   app.status.operationState.phase in ['Error', 'Failed']

  trigger.on-health-degraded: |
    - description: Application has degraded.
      send:   [app-health-degraded]
      when:   app.status.health.status == 'Degraded'

  # ----- Templates ----------------------------------------------------------
  template.app-sync-succeeded: |
    message: |
      {{.app.metadata.name}} synced successfully at {{.app.status.operationState.finishedAt}}.
    slack:
      attachments: |
        [{"title": "{{.app.metadata.name}}", "color": "#18be52",
          "fields": [{"title": "Revision", "value": "{{.app.status.sync.revision}}", "short": true}]}]

  template.app-sync-failed: |
    message: |
      {{.app.metadata.name}} sync FAILED at {{.app.status.operationState.finishedAt}}.
      Phase:    {{.app.status.operationState.phase}}
      Message:  {{.app.status.operationState.message}}
    slack:
      attachments: |
        [{"title": "{{.app.metadata.name}} sync failed", "color": "#E96D76",
          "fields": [{"title": "Project", "value": "{{.app.spec.project}}", "short": true}]}]

  template.app-health-degraded: |
    message: |
      {{.app.metadata.name}} health is DEGRADED.
      Status:   {{.app.status.health.status}}
      Message:  {{.app.status.health.message}}
    slack:
      attachments: |
        [{"title": "{{.app.metadata.name}} health degraded", "color": "#F2C744",
          "fields": [{"title": "Status", "value": "{{.app.status.health.status}}", "short": true}]}]

  # ----- Default subscriptions ----------------------------------------------
  subscriptions: |
    - recipients: [slack:taxcalc-deploys]
      triggers:   [on-sync-succeeded, on-sync-failed, on-health-degraded]
      selector:   "team=taxcalc"
